<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horváth Lámpapolír – Admin</title>
  <link rel="icon" type="image/png" href="../images/favicon.png" />
</head>
<body>
  <!-- Decap CMS (a Netlify CMS karbantartott utódja). Ugyanazt a config.yml-t és a
       Cloudflare Worker OAuth-belépést használja, mint korábban a Sveltia. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- ÉLŐ ELŐNÉZET: a szerkesztő jobb oldalán a VALÓDI oldal jelenik meg (iframe),
       és a szerkesztett – még nem mentett – tartalmat élőben belé küldjük. Így mentés
       előtt pontosan azt látod, ami mentés után lesz. -->
  <script>
    (function () {
      if (!window.CMS) return;

      // A jobb oldali előnézetet kitöltő iframe (padding nélkül).
      CMS.registerPreviewStyle(
        "html,body{margin:0;padding:0;height:100%;background:#0c0e11}" +
        ".hlp-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}",
        { raw: true }
      );

      // Gyűjtemény -> melyik oldalt töltse be az előnézet + melyik tartalom-fájl (JSON) piszkozata.
      var MAP = {
        branding: { page: "index.html",           name: "branding" },
        theme:    { page: "index.html",           name: "theme" },
        hero:     { page: "index.html",           name: "hero" },
        promo:    { page: "index.html",           name: "promo" },
        home:     { page: "index.html",           name: "home" },
        footer:   { page: "index.html",           name: "footer" },
        ai:       { page: "index.html",           name: "ai" },
        about:    { page: "index.html",           name: "about" },
        reviews:  { page: "index.html",           name: "reviews" },
        packages: { page: "csomagok.html",        name: "packages" },
        services: { page: "szolgaltatasok.html",  name: "services" },
        delivery: { page: "kiszallas.html",       name: "delivery" },
        contact:  { page: "kapcsolat.html",       name: "contact" },
        gallery:  { page: "galeria.html",         name: "gallery" },
        faq:      { page: "gyik.html",            name: "faq" }
      };

      function makePreview(cfg) {
        return createClass({
          resolve: function () {
            // A "legal" gyűjteménynek két fájlja van (adatvédelem / impresszum) – a slug dönt.
            if (cfg && cfg.legal) {
              var slug = String(this.props.entry.get("slug") || "");
              if (slug.indexOf("imprint") > -1) return { page: "impresszum.html", name: "imprint" };
              return { page: "adatvedelem.html", name: "privacy" };
            }
            return cfg;
          },
          push: function () {
            try {
              var f = this._frame;
              if (!f || !f.contentWindow) return;
              var data = this.props.entry.get("data").toJS();
              f.contentWindow.postMessage(
                { __hlpPreview: true, name: this._name, data: data },
                "*"
              );
            } catch (e) {}
          },
          componentDidMount: function () { this.push(); },
          componentDidUpdate: function () { this.push(); },
          render: function () {
            var self = this;
            var r = this.resolve();
            this._name = r.name;
            return h("iframe", {
              className: "hlp-frame",
              src: "../" + r.page + "?preview=1",
              ref: function (el) { self._frame = el; },
              onLoad: function () { self.push(); }
            });
          }
        });
      }

      Object.keys(MAP).forEach(function (coll) {
        CMS.registerPreviewTemplate(coll, makePreview(MAP[coll]));
      });
      // Jogi oldalak (adatvédelem + impresszum egy gyűjteményben)
      CMS.registerPreviewTemplate("legal", makePreview({ legal: true }));
    })();
  </script>

  <!-- Lebegő gyorslink a látogatottsági statisztikához -->
  <script>
    (function () {
      function addLink() {
        if (document.getElementById("hlp-stats-link")) return;
        var a = document.createElement("a");
        a.id = "hlp-stats-link";
        a.href = "../stats.html";
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "📊 Statisztika";
        a.title = "Látogatottsági statisztika – hányan nézték meg az oldalt";
        a.style.cssText = "position:fixed;bottom:14px;left:14px;z-index:2147483647;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:40px;background:#17171b;color:#f0b429;font:600 13px/1 'Segoe UI',Arial,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4);border:1px solid rgba(240,180,41,.55)";
        document.body.appendChild(a);
      }
      addLink();
      setInterval(addLink, 2000); // ha a CMS újrarajzolja a felületet, visszatesszük
    })();
  </script>
</body>
</html>
