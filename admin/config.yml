# GitHub backend + Cloudflare Worker OAuth (a kivezetett Netlify Identity helyett).
# A base_url-t írd át a saját Worker-címedre a telepítés után (lásd README).
backend:
  name: github
  repo: BanditaHun/horvath-lampapolir-web
  branch: main
  base_url: https://sveltia-cms-auth.andras-horvat1989.workers.dev

# Feltöltött képek helye a repóban
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Felület nyelve
locale: "hu"

collections:
  # ---- Megjelenés (betűtípus, méret, szín) ----
  - name: "theme"
    label: "Megjelenés"
    files:
      - name: "theme"
        label: "Betűk és színek"
        file: "content/theme.json"
        format: "json"
        fields:
          - name: "font_family"
            label: "Szöveg betűtípusa"
            widget: "select"
            default: "Montserrat"
            options: ["Rendszer (alap)", "Montserrat", "Poppins", "Roboto", "Inter", "Oswald", "Rajdhani", "Bebas Neue", "Anton"]
          - name: "heading_font_family"
            label: "Címek betűtípusa"
            widget: "select"
            default: "Oswald"
            options: ["Rendszer (alap)", "Montserrat", "Poppins", "Roboto", "Inter", "Oswald", "Rajdhani", "Bebas Neue", "Anton"]
          - name: "base_font_size"
            label: "Alap betűméret"
            widget: "select"
            default: "16px"
            options: ["14px", "15px", "16px", "17px", "18px", "20px"]
          - name: "heading_scale"
            label: "Címek mérete (szorzó)"
            widget: "select"
            default: "1"
            options: ["0.9", "1", "1.1", "1.25", "1.4"]
          - { name: "accent_color", label: "Kiemelő szín (arany)", widget: "color", default: "#f0b429" }

  # ---- Fejléc (hero) ----
  - name: "hero"
    label: "Fejléc"
    files:
      - name: "hero"
        label: "Fejléc szövegek"
        file: "content/hero.json"
        format: "json"
        fields:
          - { name: "title", label: "Cím", widget: "string" }
          - { name: "subtitle", label: "Alcím", widget: "text" }
          - { name: "banner", label: "Banner kép (a kezdőlap tetején)", widget: "image", required: false, hint: "A kész, feliratos plakát – középen jelenik meg. Ha üres, letisztult sötét szöveges fejléc marad." }
          - { name: "side_left", label: "Bal oldali FELSŐ kép a banner mellett (opcionális)", widget: "image", required: false, hint: "Széles képernyőn a banner BAL oldalán, felül jelenik meg, animáltan. Álló/négyzetes kép ajánlott. Ha egy oldalsó kép sincs, animált neon buborékok jelennek meg." }
          - { name: "side_left_2", label: "Bal oldali ALSÓ kép (opcionális)", widget: "image", required: false, hint: "A bal oldali felső kép alá kerül – jó egy munka közbeni fotó." }
          - { name: "side_right", label: "Jobb oldali FELSŐ kép a banner mellett (opcionális)", widget: "image", required: false, hint: "Széles képernyőn a banner JOBB oldalán, felül jelenik meg, animáltan." }
          - { name: "side_right_2", label: "Jobb oldali ALSÓ kép (opcionális)", widget: "image", required: false, hint: "A jobb oldali felső kép alá kerül." }
          - name: "ticker"
            label: "Futó szalag szövegei (a banner alatt)"
            widget: "list"
            required: false
            field: { name: "text", label: "Szöveg", widget: "string" }
            hint: "Ezek folyamatosan futnak balról jobbra a kezdőlapon. Adj hozzá rövid, ütős üzeneteket."

  # ---- Bemutatkozás ----
  - name: "about"
    label: "Bemutatkozás"
    files:
      - name: "about"
        label: "Bemutatkozás szöveg"
        file: "content/about.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "text", label: "Szöveg", widget: "markdown", hint: "Kijelöléssel félkövér (B), címsor és lista is beállítható a szerkesztő eszköztárában." }

  # ---- Csomagok ----
  - name: "packages"
    label: "Csomagok"
    files:
      - name: "packages"
        label: "Csomagok listája"
        file: "content/packages.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (az oldal tetején)", widget: "markdown", required: false, hint: "A Csomagok oldal tetején jelenik meg. Félkövér, címsor, lista is használható." }
          - name: "items"
            label: "Csomagok"
            widget: "list"
            fields:
              - { name: "name", label: "Név", widget: "string" }
              - { name: "description", label: "Leírás", widget: "markdown", required: false, hint: "Bővebb leírás – félkövér, címsor, lista is használható." }
              - { name: "price", label: "Ár", widget: "string" }

  # ---- Önálló szolgáltatások ----
  - name: "services"
    label: "Önálló szolgáltatások"
    files:
      - name: "services"
        label: "Szolgáltatások listája"
        file: "content/services.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (az oldal tetején)", widget: "markdown", required: false, hint: "A Szolgáltatások oldal tetején jelenik meg." }
          - name: "items"
            label: "Szolgáltatások"
            widget: "list"
            fields:
              - { name: "name", label: "Megnevezés", widget: "string" }
              - { name: "description", label: "Leírás", widget: "markdown", required: false, hint: "Bővebb leírás – félkövér, címsor, lista is használható." }
              - { name: "price", label: "Ár", widget: "string" }

  # ---- Kiszállási díj ----
  - name: "delivery"
    label: "Kiszállási díj"
    files:
      - name: "delivery"
        label: "Kiszállási díjak"
        file: "content/delivery.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (az oldal tetején)", widget: "markdown", required: false }
          - name: "items"
            label: "Sávok"
            widget: "list"
            fields:
              - { name: "range", label: "Távolság", widget: "string" }
              - { name: "fee", label: "Díj", widget: "string" }
              - { name: "description", label: "Megjegyzés (opcionális)", widget: "markdown", required: false }

  # ---- Elérhetőség ----
  - name: "contact"
    label: "Elérhetőség"
    files:
      - name: "contact"
        label: "Kapcsolati adatok"
        file: "content/contact.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "phone", label: "Telefonszám", widget: "string", hint: "A fejléc felső sávjában és a Kapcsolat szekcióban is megjelenik (kattintható hívás)." }
          - { name: "note", label: "Megjegyzés (elérhetőség)", widget: "markdown", hint: "Félkövér, címsor, lista is használható." }
          - { name: "facebook_url", label: "Facebook link", widget: "string", required: false, hint: "A fejléc felső sávjában is megjelenik ikonként. Üresen hagyva elrejtve." }
          - { name: "facebook_label", label: "Facebook gomb felirata", widget: "string", required: false }
          - { name: "instagram_url", label: "Instagram link (opcionális)", widget: "string", required: false, hint: "Ha kitöltöd, megjelenik a fejléc felső sávjában. Üresen hagyva elrejtve." }
          - { name: "email", label: "E-mail (opcionális)", widget: "string", required: false }

  # ---- Galéria ----
  - name: "gallery"
    label: "Galéria"
    files:
      - name: "gallery"
        label: "Galéria képek"
        file: "content/gallery.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - name: "items"
            label: "Képek"
            widget: "list"
            fields:
              - { name: "image", label: "Kép", widget: "image" }
              - { name: "caption", label: "Képaláírás", widget: "string", required: false }

  # ---- Vélemények (a kezdőlap alján) ----
  - name: "reviews"
    label: "Vélemények"
    files:
      - name: "reviews"
        label: "Vélemények és értékelések"
        file: "content/reviews.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg", widget: "markdown", required: false }
          - { name: "form_access_key", label: "Web3Forms hozzáférési kulcs (a beküldő űrlaphoz)", widget: "string", required: false, hint: "Ingyenes kulcs a web3forms.com oldalon (csak e-mail kell). Ha kitöltöd, a látogatók közvetlenül az oldalon írhatnak véleményt (e-mailben megkapod). Ha üres, Facebook-értékelés gomb jelenik meg helyette." }
          - name: "items"
            label: "Megjelenő vélemények (moderált)"
            widget: "list"
            required: false
            fields:
              - { name: "name", label: "Név", widget: "string" }
              - { name: "rating", label: "Csillagok (1–5)", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
              - { name: "text", label: "Vélemény szövege", widget: "text" }
              - { name: "date", label: "Dátum (opcionális)", widget: "string", required: false }
