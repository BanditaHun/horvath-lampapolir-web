# GitHub backend + Cloudflare Worker OAuth (a kivezetett Netlify Identity helyett).
# A base_url-t írd át a saját Worker-címedre a telepítés után (lásd README).
backend:
  name: github
  repo: BanditaHun/horvath-lampapolir-web
  branch: main
  base_url: https://sveltia-cms-auth.andras-horvat1989.workers.dev

# Feltöltött képek helye a repóban
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Felület nyelve
locale: "hu"

collections:
  # ---- Megjelenés (betűtípus, méret, szín) ----
  - name: "theme"
    label: "Megjelenés"
    files:
      - name: "theme"
        label: "Betűk és színek"
        file: "content/theme.json"
        format: "json"
        fields:
          - name: "font_family"
            label: "Szöveg betűtípusa"
            widget: "select"
            default: "Montserrat"
            options: ["Rendszer (alap)", "Montserrat", "Poppins", "Roboto", "Inter", "Oswald", "Rajdhani", "Bebas Neue", "Anton"]
          - name: "heading_font_family"
            label: "Címek betűtípusa"
            widget: "select"
            default: "Oswald"
            options: ["Rendszer (alap)", "Montserrat", "Poppins", "Roboto", "Inter", "Oswald", "Rajdhani", "Bebas Neue", "Anton"]
          - name: "base_font_size"
            label: "Alap betűméret"
            widget: "select"
            default: "16px"
            options: ["14px", "15px", "16px", "17px", "18px", "20px"]
          - name: "heading_scale"
            label: "Címek mérete (szorzó)"
            widget: "select"
            default: "1"
            options: ["0.9", "1", "1.1", "1.25", "1.4"]
          - { name: "accent_color", label: "Kiemelő szín (arany)", widget: "color", default: "#f0b429" }

  # ---- Fejléc (hero) ----
  - name: "hero"
    label: "Fejléc"
    files:
      - name: "hero"
        label: "Fejléc szövegek"
        file: "content/hero.json"
        format: "json"
        fields:
          - { name: "title", label: "Cím", widget: "string" }
          - { name: "subtitle", label: "Alcím", widget: "text" }
          - { name: "banner", label: "Banner kép (a kezdőlap tetején)", widget: "image", required: false, hint: "A kész, feliratos plakát – középen jelenik meg. Ha üres, letisztult sötét szöveges fejléc marad." }
          - name: "side_left_images"
            label: "Bal oldali képek (a banner mellett, fentről le)"
            label_singular: "Kép"
            widget: "list"
            required: false
            hint: "Tetszőleges számú kép a banner BAL oldalán, egymás alatt. Az „+” gombbal adhatsz hozzá, húzással átrendezheted, és mindegyiknél beállíthatod a MÉRETET. Ha üres, animált neon buborékok jelennek meg."
            fields:
              - { name: "image", label: "Kép", widget: "image" }
              - { name: "size", label: "Megjelenő méret", widget: "select", default: "m", options: [ { label: "Kicsi", value: "s" }, { label: "Közepes", value: "m" }, { label: "Nagy", value: "l" } ] }
          - name: "side_right_images"
            label: "Jobb oldali képek (a banner mellett, fentről le)"
            label_singular: "Kép"
            widget: "list"
            required: false
            hint: "Tetszőleges számú kép a banner JOBB oldalán, egymás alatt. Hozzáadás „+”-szal, átrendezés húzással, méret beállítható képenként."
            fields:
              - { name: "image", label: "Kép", widget: "image" }
              - { name: "size", label: "Megjelenő méret", widget: "select", default: "m", options: [ { label: "Kicsi", value: "s" }, { label: "Közepes", value: "m" }, { label: "Nagy", value: "l" } ] }
          - name: "ticker"
            label: "Futó szalag szövegei (a banner alatt)"
            widget: "list"
            required: false
            field: { name: "text", label: "Szöveg", widget: "string" }
            hint: "Ezek folyamatosan futnak balról jobbra a kezdőlapon. Adj hozzá rövid, ütős üzeneteket."

  # ---- Akció / kiemelt ajánlat (kezdőlap) ----
  - name: "promo"
    label: "Akció (kezdőlap)"
    files:
      - name: "promo"
        label: "Kiemelt akció"
        file: "content/promo.json"
        format: "json"
        fields:
          - { name: "active", label: "Akció bekapcsolva?", widget: "boolean", default: true, hint: "Kikapcsolva eltűnik a kezdőlapról – nem kell törölni." }
          - { name: "badge", label: "Kör-jelvény szövege (pl. -10%)", widget: "string", required: false }
          - { name: "eyebrow", label: "Kis felső címke (pl. Őszi akció)", widget: "string", required: false }
          - { name: "heading", label: "Fő cím", widget: "string" }
          - { name: "text", label: "Leírás", widget: "markdown", hint: "Félkövér, lista is használható." }
          - { name: "valid_text", label: "Érvényesség / feltétel", widget: "string", required: false }
          - { name: "cta_label", label: "Gomb felirata", widget: "string", required: false, default: "Kérj időpontot" }
          - { name: "cta_href", label: "Gomb hivatkozása", widget: "string", required: false, default: "kapcsolat.html" }
          - { name: "image", label: "Háttérkép", widget: "image", required: false }
          - { name: "multicar_active", label: "Több autós kedvezmény bekapcsolva?", widget: "boolean", default: true, hint: "Az AI ennek megfelelően válaszol a „2 autóra jár kedvezmény?” kérdésre. Kikapcsolva azt mondja, hogy nincs meghirdetve." }
          - { name: "multicar_text", label: "Több autós kedvezmény szövege", widget: "text", required: false }

  # ---- Kezdőlap tartalom (kártyák, bizalmi sáv, „Miért válassz", települések) ----
  - name: "home"
    label: "Kezdőlap tartalom"
    files:
      - name: "home"
        label: "Kezdőlapi blokkok"
        file: "content/home.json"
        format: "json"
        fields:
          - { name: "intro", label: "Rövid leírás (a bizalmi sáv alatt a kezdőlapon)", widget: "text", required: false, hint: "**félkövér** használható." }
          - name: "quick"
            label: "Kiemelt kártyák (3 db)"
            widget: "list"
            fields:
              - { name: "title", label: "Cím", widget: "string" }
              - { name: "text", label: "Szöveg", widget: "text" }
              - { name: "link", label: "Hivatkozás (pl. csomagok.html)", widget: "string" }
              - { name: "more", label: "Gomb-felirat (pl. Megnézem →)", widget: "string", required: false }
          - name: "trust"
            label: "Bizalmi sáv (a hero alatt)"
            widget: "list"
            fields:
              - { name: "icon", label: "Ikon (emoji)", widget: "string" }
              - { name: "text", label: "Szöveg (**félkövér** használható)", widget: "string" }
          - { name: "why_heading", label: "„Miért válassz engem?” – szakaszcím", widget: "string" }
          - name: "why"
            label: "„Miért válassz engem?” – érvek"
            widget: "list"
            fields:
              - { name: "icon", label: "Ikon (emoji)", widget: "string" }
              - { name: "title", label: "Cím", widget: "string" }
              - { name: "text", label: "Szöveg", widget: "text" }
          - { name: "premium_heading", label: "„Prémium alapanyagok” – szakaszcím", widget: "string", required: false }
          - { name: "premium_lead", label: "„Prémium alapanyagok” – bevezető szöveg", widget: "text", required: false }
          - name: "premium_points"
            label: "„Prémium alapanyagok” – pontok"
            widget: "list"
            required: false
            fields:
              - { name: "icon", label: "Ikon (emoji)", widget: "string" }
              - { name: "title", label: "Cím", widget: "string" }
              - { name: "text", label: "Szöveg", widget: "string", required: false }
          - { name: "areas_heading", label: "„Hol dolgozom?” – szakaszcím", widget: "string" }
          - { name: "areas_lead", label: "„Hol dolgozom?” – bevezető szöveg", widget: "text" }
          - { name: "areas_towns", label: "Kiszolgált települések (soronként/vesszővel)", widget: "list" }
          - { name: "areas_note", label: "„Hol dolgozom?” – megjegyzés (link is használható)", widget: "string", required: false }

  # ---- Lábléc ----
  - name: "footer"
    label: "Lábléc"
    files:
      - name: "footer"
        label: "Lábléc szövegek"
        file: "content/footer.json"
        format: "json"
        fields:
          - { name: "subtitle", label: "Alcím (a logó mellett)", widget: "string" }
          - { name: "tags", label: "Kiemelt sor (arany szöveg)", widget: "text" }
          - { name: "payment", label: "Fizetési sor (a kártya-ikon mellett)", widget: "string", required: false }

  # ---- AI chat-segéd ----
  - name: "ai"
    label: "AI segéd"
    files:
      - name: "ai"
        label: "AI chat-segéd beállításai"
        file: "content/ai.json"
        format: "json"
        fields:
          - { name: "enabled", label: "AI segéd bekapcsolva?", widget: "boolean", default: true, hint: "Kikapcsolva eltűnik a chat-buborék az oldalról." }
          - { name: "launch_label", label: "Buborék felirata", widget: "string", required: false, default: "Kérdezz!" }
          - { name: "title", label: "Chat fejléc címe", widget: "string", required: false, default: "Lámpa-segéd" }
          - { name: "greeting", label: "Üdvözlő üzenet", widget: "text", hint: "Ezzel a szöveggel indul a beszélgetés." }
          - { name: "api_url", label: "AI Worker címe", widget: "string", hint: "A Cloudflare Worker URL-je – ne töröld, csak ha új Workert állítasz be." }

  # ---- Bemutatkozás ----
  - name: "about"
    label: "Bemutatkozás"
    files:
      - name: "about"
        label: "Bemutatkozás szöveg"
        file: "content/about.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "text", label: "Szöveg", widget: "markdown", hint: "Kijelöléssel félkövér (B), címsor és lista is beállítható a szerkesztő eszköztárában." }

  # ---- Csomagok ----
  - name: "packages"
    label: "Csomagok"
    files:
      - name: "packages"
        label: "Csomagok listája"
        file: "content/packages.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (az oldal tetején)", widget: "markdown", required: false, hint: "A Csomagok oldal tetején jelenik meg. Félkövér, címsor, lista is használható." }
          - name: "items"
            label: "Csomagok"
            widget: "list"
            fields:
              - { name: "name", label: "Név", widget: "string" }
              - { name: "badge", label: "Címke (pl. Legnépszerűbb, Ajánlott, Kiegészítő) – opcionális", widget: "string", required: false }
              - { name: "description", label: "Leírás", widget: "markdown", required: false, hint: "Bővebb leírás – félkövér, címsor, lista is használható." }
              - { name: "price", label: "Ár", widget: "string" }

  # ---- Önálló szolgáltatások ----
  - name: "services"
    label: "Önálló szolgáltatások"
    files:
      - name: "services"
        label: "Szolgáltatások listája"
        file: "content/services.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (az oldal tetején)", widget: "markdown", required: false, hint: "A Szolgáltatások oldal tetején jelenik meg." }
          - name: "items"
            label: "Szolgáltatások"
            widget: "list"
            fields:
              - { name: "name", label: "Megnevezés", widget: "string" }
              - { name: "description", label: "Leírás", widget: "markdown", required: false, hint: "Bővebb leírás – félkövér, címsor, lista is használható." }
              - { name: "price", label: "Ár", widget: "string" }

  # ---- Kiszállási díj ----
  - name: "delivery"
    label: "Kiszállási díj"
    files:
      - name: "delivery"
        label: "Kiszállási díjak"
        file: "content/delivery.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (az oldal tetején)", widget: "markdown", required: false }
          - name: "items"
            label: "Sávok"
            widget: "list"
            fields:
              - { name: "range", label: "Távolság", widget: "string" }
              - { name: "fee", label: "Díj", widget: "string" }
              - { name: "description", label: "Megjegyzés (opcionális)", widget: "markdown", required: false }

  # ---- Elérhetőség ----
  - name: "contact"
    label: "Elérhetőség"
    files:
      - name: "contact"
        label: "Kapcsolati adatok"
        file: "content/contact.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "phone", label: "Telefonszám", widget: "string", hint: "A fejléc felső sávjában és a Kapcsolat szekcióban is megjelenik (kattintható hívás)." }
          - { name: "note", label: "Megjegyzés (elérhetőség)", widget: "markdown", hint: "Félkövér, címsor, lista is használható." }
          - { name: "facebook_url", label: "Facebook link", widget: "string", required: false, hint: "A fejléc felső sávjában is megjelenik ikonként. Üresen hagyva elrejtve." }
          - { name: "facebook_label", label: "Facebook gomb felirata", widget: "string", required: false }
          - { name: "instagram_url", label: "Instagram link (opcionális)", widget: "string", required: false, hint: "Ha kitöltöd, megjelenik a fejléc felső sávjában. Üresen hagyva elrejtve." }
          - { name: "email", label: "E-mail (opcionális)", widget: "string", required: false }
          - { name: "google_url", label: "Google Cégprofil link (a profilra visz)", widget: "string", required: false, hint: "Pl. https://g.page/r/XXXX – a láblécben és a Kapcsolat oldalon jelenik meg." }
          - { name: "google_review_url", label: "Google értékelés-kérő link (/review)", widget: "string", required: false, hint: "Pl. https://g.page/r/XXXX/review – az „Értékelj a Google-on” gombra." }
          - { name: "map_lat", label: "Térkép – székhely szélesség (lat)", widget: "string", required: false, hint: "A piros kör középpontja. Pl. 46.4256 (Tolna). Üresen hagyva nincs térkép." }
          - { name: "map_lng", label: "Térkép – székhely hosszúság (lng)", widget: "string", required: false, hint: "Pl. 18.7817." }
          - { name: "map_radius_km", label: "Piros kör sugara (km)", widget: "string", required: false, default: "50" }

  # ---- Galéria ----
  - name: "gallery"
    label: "Galéria"
    files:
      - name: "gallery"
        label: "Galéria képek"
        file: "content/gallery.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - name: "items"
            label: "Képek"
            widget: "list"
            fields:
              - { name: "image", label: "Kép", widget: "image" }
              - { name: "caption", label: "Képaláírás", widget: "string", required: false }

  # ---- GYIK (gyakori kérdések) ----
  - name: "faq"
    label: "GYIK (gyakori kérdések)"
    files:
      - name: "faq"
        label: "Kérdések és válaszok"
        file: "content/faq.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg (opcionális)", widget: "markdown", required: false }
          - name: "items"
            label: "Kérdések"
            widget: "list"
            fields:
              - { name: "q", label: "Kérdés", widget: "string" }
              - { name: "a", label: "Válasz", widget: "markdown", hint: "Félkövér, lista, link is használható." }

  # ---- Vélemények (a kezdőlap alján) ----
  - name: "reviews"
    label: "Vélemények"
    files:
      - name: "reviews"
        label: "Vélemények és értékelések"
        file: "content/reviews.json"
        format: "json"
        fields:
          - { name: "heading", label: "Szakasz címe", widget: "string" }
          - { name: "intro", label: "Bevezető szöveg", widget: "markdown", required: false }
          - { name: "api_url", label: "Vélemény-API címe (Cloudflare Worker)", widget: "string", required: false, hint: "Ha ki van töltve, a látogatók véleménye a küldés után AZONNAL megjelenik az oldalon (nem e-mailben). Alapból be van állítva – ne töröld." }
          - { name: "form_access_key", label: "Web3Forms kulcs (nem szükséges, ha az API be van állítva)", widget: "string", required: false }
          - name: "items"
            label: "Kézzel felvett (kiemelt) vélemények"
            widget: "list"
            required: false
            fields:
              - { name: "name", label: "Név", widget: "string" }
              - { name: "rating", label: "Csillagok (1–5)", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
              - { name: "text", label: "Vélemény szövege", widget: "text" }
              - { name: "date", label: "Dátum (opcionális)", widget: "string", required: false }

  # ---- Jogi oldalak ----
  - name: "legal"
    label: "Jogi oldalak"
    files:
      - name: "privacy"
        label: "Adatvédelmi tájékoztató"
        file: "content/privacy.json"
        format: "json"
        fields:
          - { name: "heading", label: "Cím", widget: "string" }
          - { name: "body", label: "Tartalom", widget: "markdown", hint: "A *[...]* helyőrzőket töltsd ki a saját adataiddal." }
      - name: "imprint"
        label: "Impresszum"
        file: "content/imprint.json"
        format: "json"
        fields:
          - { name: "heading", label: "Cím", widget: "string" }
          - { name: "body", label: "Tartalom", widget: "markdown", hint: "A *[...]* helyőrzőket töltsd ki a saját adataiddal." }
