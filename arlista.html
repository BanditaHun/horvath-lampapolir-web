<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Árlista – Horváth Lámpapolír</title>
<link rel="icon" href="images/favicon.png">
<style>
  :root { --ink:#23262b; --dim:#5c636e; --faint:#6b7280; --gold:#a9760a; --gold2:#c8901a; --gold3:#e0a41c; --line:#e6ddca; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #4a4d55; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); }

  /* Képernyős eszköztár (nyomtatáskor eltűnik) */
  .toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    background: #2c2e34; padding: 12px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .toolbar__msg { color: #cfd3da; font-size: 13.5px; margin-right: auto; }
  .toolbar__msg b { color: #f0b429; }
  .tbtn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 40px; border: 0; cursor: pointer;
    font-size: 14px; font-weight: 700; text-decoration: none; }
  .tbtn--print { background: linear-gradient(90deg,#e0a41c,#c8901a); color: #17171b; }
  .tbtn--print:hover { filter: brightness(1.06); }
  .tbtn--back { background: transparent; color: #cfd3da; border: 1px solid #565963; }
  .tbtn--back:hover { background: rgba(255,255,255,.06); }

  /* A4 „lap" */
  .sheet { width: 210mm; min-height: 297mm; margin: 18px auto; background: #fff; padding: 12mm 12mm 10mm;
    box-shadow: 0 10px 40px rgba(0,0,0,.45); font-size: 10.3px; line-height: 1.42; }

  .gold { color: var(--gold); }
  h2 { font-size: 13px; letter-spacing: .3px; margin: 0 0 7px; color: var(--ink); text-transform: uppercase; }
  h2 .bar { display: inline-block; width: 22px; height: 3px; background: linear-gradient(90deg,var(--gold3),var(--gold2)); border-radius: 2px; vertical-align: middle; margin-right: 8px; }
  h2 .sub { font-weight: 400; font-size: 9px; color: var(--faint); text-transform: none; letter-spacing: 0; }
  section { margin-bottom: 12px; }

  header.head { display: flex; align-items: center; gap: 16px; border-bottom: 2.5px solid var(--gold3); padding-bottom: 12px; margin-bottom: 14px; }
  header.head img.logo { width: 74px; height: 74px; object-fit: contain; }
  .brand { flex: 1; }
  .brand__name { font-size: 21px; font-weight: 800; letter-spacing: .3px; }
  .brand__tag { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .brand__meta { margin-top: 6px; font-size: 9.6px; color: #3a3f47; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .brand__meta b { color: var(--gold); }
  .seal { width: 66px; flex: none; }
  .seal svg { width: 100%; height: auto; }

  .pkgs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
  .pkg { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px 9px; background: #fffdf8; }
  .pkg--hl { border-color: var(--gold3); box-shadow: inset 0 0 0 1px #f0d79a; }
  .pkg__badge { position: absolute; top: -8px; right: 9px; background: linear-gradient(90deg,var(--gold3),var(--gold2)); color: #fff; font-size: 8px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: .4px; }
  .pkg__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; margin-bottom: 6px; }
  .pkg__name { font-size: 14px; font-weight: 800; color: var(--gold); letter-spacing: .3px; }
  .pkg__sub { font-size: 8.8px; color: var(--dim); margin-top: 1px; }
  .pkg__price { font-size: 12.5px; font-weight: 800; white-space: nowrap; text-align: right; }
  .pkg__pts { margin: 0; padding: 0; list-style: none; }
  .pkg__pts li { position: relative; padding-left: 12px; margin-bottom: 3px; }
  .pkg__pts li::before { content: "✓"; position: absolute; left: 0; color: var(--gold2); font-weight: 700; }
  .pkg__note { font-size: 8.6px; color: var(--faint); font-style: italic; margin-top: 6px; border-top: 1px solid #f0ead9; padding-top: 5px; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid #eee7d8; }
  .row__name { font-weight: 700; }
  .row__sub { display: block; font-size: 8.8px; color: var(--faint); margin-top: 1px; }
  .row__price { font-weight: 800; color: var(--gold); white-space: nowrap; }

  .dels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .del { border: 1px solid var(--line); border-radius: 7px; padding: 8px 6px; text-align: center; background: #fffdf8; }
  .del > span:first-child { display: block; font-size: 9.4px; color: var(--dim); margin-bottom: 3px; }
  .del__fee { font-weight: 800; color: var(--gold); font-size: 11px; }

  .promo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .promo__box { border: 1px solid var(--gold3); border-radius: 8px; padding: 9px 12px; background: linear-gradient(135deg,#fff8e9,#fffdf8); }
  .promo__box b { color: var(--gold); }
  .promo__tag { display: inline-block; background: var(--gold2); color: #fff; font-weight: 800; font-size: 9px; padding: 2px 8px; border-radius: 5px; margin-right: 6px; }

  footer.foot { margin-top: 12px; border-top: 2px solid var(--gold3); padding-top: 9px; font-size: 9px; color: #4a4f57; }
  footer.foot .pay { font-weight: 700; color: var(--ink); }
  footer.foot .fine { color: var(--faint); margin-top: 4px; }
  .nowrap { white-space: nowrap; }
  .loading { text-align: center; color: var(--dim); padding: 60px 0; }

  @media (max-width: 780px) {
    .sheet { width: 100%; min-height: 0; margin: 0; padding: 18px 14px 24px; box-shadow: none; }
    .pkgs { grid-template-columns: 1fr; }
    .two, .promo { grid-template-columns: 1fr; }
    .dels { grid-template-columns: 1fr 1fr; }
    body { background: #fff; }
  }

  @media print {
    @page { size: A4; margin: 12mm 12mm 10mm; }
    body { background: #fff; }
    .toolbar { display: none !important; }
    .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
    section { break-inside: avoid; }
    .pkg, .del, .promo__box { break-inside: avoid; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar__msg">Ez az árlista <b>mindig a friss árakat</b> mutatja. Mentsd PDF-be vagy nyomtasd ki:</span>
    <button class="tbtn tbtn--print" onclick="window.print()">🖨️ Nyomtatás / PDF mentése</button>
    <a class="tbtn tbtn--back" href="csomagok.html">← Vissza az oldalra</a>
  </div>

  <div class="sheet" id="sheet">
    <div class="loading">Árlista betöltése…</div>
  </div>

<script>
const SEAL =
  '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b43a"/><stop offset="0.5" stop-color="#c8901a"/><stop offset="1" stop-color="#9a6c0c"/></linearGradient><path id="t" d="M22,60 a38,38 0 0 1 76,0" fill="none"/></defs>' +
  '<circle cx="60" cy="60" r="56" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-dasharray="1.5 4.5" stroke-linecap="round"/>' +
  '<circle cx="60" cy="60" r="47" fill="#fff" stroke="url(#g)" stroke-width="3.5"/>' +
  '<text font-family="Georgia,serif" font-size="8" font-weight="700" letter-spacing="0.5" fill="#a9760a"><textPath href="#t" startOffset="50%" text-anchor="middle">PRÉMIUM MINŐSÉG</textPath></text>' +
  '<path d="M60 39 L64.5 55.5 L81 60 L64.5 64.5 L60 81 L55.5 64.5 L39 60 L55.5 55.5 Z" fill="url(#g)"/><circle cx="60" cy="60" r="3.2" fill="#fff"/>' +
  '<text x="60" y="95" font-family="Georgia,serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#a9760a" text-anchor="middle">ALAPANYAGOK</text>' +
  '<text x="60" y="105.5" font-size="7.5" letter-spacing="2.5" fill="#c8901a" text-anchor="middle">★ ★ ★</text></svg>';

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function bold(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>"); }

// A markdown-leírásból kiszedi a "- " felsorolás-pontokat és a záró *dőlt* megjegyzést.
function parseDesc(md){
  const lines = String(md||"").split("\n");
  const pts = [], notes = [];
  for (let ln of lines){
    ln = ln.trim();
    if (!ln) continue;
    if (ln.startsWith("- ")) pts.push(ln.slice(2).trim());
    else if (/^\*[^*].*\*$/.test(ln)) notes.push(ln.replace(/^\*|\*$/g,"").trim());
    else pts.push(ln); // sima sor is pontnak számít
  }
  return { pts, note: notes.join(" ") };
}

async function loadJSON(p){
  const r = await fetch(p + "?_=" + Date.now(), { cache:"no-store" });
  if (!r.ok) throw new Error(p);
  return r.json();
}

function pkgBlock(it){
  const d = parseDesc(it.description);
  const hl = /aj[aá]nlott/i.test(it.badge||"");
  return '<div class="pkg'+(hl?' pkg--hl':'')+'">'
    + (it.badge ? '<span class="pkg__badge">'+esc(it.badge)+'</span>' : '')
    + '<div class="pkg__head"><div><div class="pkg__name">'+esc(it.name)+'</div></div>'
    + '<div class="pkg__price">'+esc(it.price).replace(/ /g,"&nbsp;")+'</div></div>'
    + '<ul class="pkg__pts">'+d.pts.map(p=>'<li>'+bold(p)+'</li>').join('')+'</ul>'
    + (d.note ? '<div class="pkg__note">'+bold(d.note)+'</div>' : '')
    + '</div>';
}

function rowBlock(name, sub, price){
  return '<div class="row"><div class="row__t"><span class="row__name">'+esc(name)+'</span>'
    + (sub ? '<span class="row__sub">'+esc(sub)+'</span>' : '')
    + '</div><div class="row__price">'+esc(price).replace(/ /g,"&nbsp;")+'</div></div>';
}

// Markdown-jelek eltávolítása (hogy a levágott alcímből ne lógjon ki nyers ** vagy *).
function stripMd(s){ return String(s||"").replace(/\*\*/g,"").replace(/\*/g,"").replace(/`/g,"").replace(/\[(.+?)\]\([^)]*\)/g,"$1"); }

// A hosszú leírásokból egy tömör alcímet készít (első dőlt megjegyzés vagy első pont).
function shortSub(desc){
  const d = parseDesc(desc);
  let s = d.note || d.pts[0] || "";
  s = stripMd(s).replace(/\s+/g," ").trim();
  if (s.length > 90) s = s.slice(0,88).replace(/\s+\S*$/,"") + "…";
  return s;
}
function cleanName(n){ return String(n||"").replace(/^[^\wÁÉÍÓÖŐÚÜŰáéíóöőúüű0-9]+/,"").replace(/\s*\(kieg[eé]sz[ií]t[őo] opci[óo]\)/i,"").trim(); }

async function build(){
  let pk={}, sv={}, dl={}, pr={}, ct={};
  try { pk = await loadJSON("content/packages.json"); } catch(e){}
  try { sv = await loadJSON("content/services.json"); } catch(e){}
  try { dl = await loadJSON("content/delivery.json"); } catch(e){}
  try { pr = await loadJSON("content/promo.json"); } catch(e){}
  try { ct = await loadJSON("content/contact.json"); } catch(e){}

  const items = (pk.items||[]);
  const isAddon = it => /kieg[eé]sz[ií]t/i.test(it.badge||"");
  const mains = items.filter(it=>!isAddon(it)).slice(0,3);
  const addons = items.filter(isAddon);

  const phone = ct.phone || "+36 20 541 8369";
  const note = ct.note || "Hétfőtől vasárnapig, 8:00–16:00";
  const time = (note.match(/\d{1,2}[:.]\d{2}\s*[–-]\s*\d{1,2}[:.]\d{2}/)||["8:00–16:00"])[0];
  const hours = (/vas[aá]rnap|h[eé]tf/i.test(note) ? "H–V " : "") + time;

  let html = ''
  + '<header class="head">'
  +   '<img class="logo" src="images/logo.png" alt="" onerror="this.style.display=\'none\'">'
  +   '<div class="brand"><div class="brand__name">Horváth Lámpapolír</div>'
  +     '<div class="brand__tag">Mobil fényszóró-felújítás – házhoz megyünk Tolna megyében</div>'
  +     '<div class="brand__meta"><span><b>Tel:</b> '+esc(phone)+'</span><span><b>Web:</b> horvathlampapolir.hu</span>'
  +       '<span><b>Terület:</b> Tolna megye, 50 km</span><span><b>Nyitva:</b> '+esc(hours)+'</span></div>'
  +   '</div><div class="seal">'+SEAL+'</div>'
  + '</header>';

  if (mains.length) {
    html += '<section><h2><span class="bar"></span>Fényszóró-felújítási csomagok</h2>'
      + '<div class="pkgs">'+mains.map(pkgBlock).join('')+'</div></section>';
  }

  if (addons.length) {
    html += '<section><h2><span class="bar"></span>Kiegészítő opciók</h2><div class="two">'
      + addons.map(a=>rowBlock(cleanName(a.name), shortSub(a.description), a.price)).join('')
      + '</div></section>';
  }

  const svItems = (sv.items||[]);
  if (svItems.length) {
    html += '<section><h2><span class="bar"></span>Önálló szolgáltatások</h2><div class="two">'
      + svItems.map(s=>rowBlock(s.name, shortSub(s.description), s.price)).join('')
      + '</div></section>';
  }

  const dlItems = (dl.items||[]);
  if (dlItems.length) {
    html += '<section><h2><span class="bar"></span>Kiszállási díj <span class="sub">(egyszeri, a teljes oda-vissza utat fedezi)</span></h2>'
      + '<div class="dels">'+dlItems.map(d=>'<div class="del"><span>'+esc(d.range)+'</span><span class="del__fee">'+esc(d.fee).replace(/ /g,"&nbsp;")+'</span></div>').join('')+'</div></section>';
  }

  const promoBoxes = [];
  if (pr.active) {
    const badge = pr.badge || "AKCIÓ";
    const heading = pr.heading || pr.eyebrow || "Aktuális akció";
    const valid = pr.valid_text ? (' '+pr.valid_text.replace(/\s+/g,' ')) : '';
    promoBoxes.push('<div class="promo__box"><span class="promo__tag">'+esc(badge)+'</span><b>'+esc(pr.eyebrow||"Akció")+'</b> – '+bold(pr.heading||"")+esc(valid)+'</div>');
  }
  if (pr.multicar_active !== false && pr.multicar_text) {
    promoBoxes.push('<div class="promo__box"><span class="promo__tag">TÖBB AUTÓ</span><b>Több autó egy helyszínen</b> – '+bold(pr.multicar_text)+'</div>');
  }
  if (promoBoxes.length) {
    html += '<section><h2><span class="bar"></span>Aktuális kedvezmények</h2><div class="promo">'+promoBoxes.join('')+'</div></section>';
  }

  const today = new Date();
  const stamp = today.getFullYear()+'. '+['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'][today.getMonth()];
  html += '<footer class="foot">'
    + '<div><b class="gold">Minden fényszóró-csomaghoz jár:</b> ingyenes akkumulátor-állapot ellenőrzés és fagyálló-mérés.</div>'
    + '<div class="pay" style="margin-top:4px">Fizetés: bankkártya (érintéses is), Mastercard, Visa és készpénz · Számlaképes egyéni vállalkozás</div>'
    + '<div class="fine">Az árak tájékoztató jellegűek; a végleges ár az ingyenes helyszíni állapotfelmérés után, az autó állapotától és a választott szolgáltatástól függően alakul. Nagyobb járművek (teherautó, kamion, furgon) szélvédője a nagyobb felület miatt magasabb áron. Frissítve: '+stamp+'.</div>'
    + '</footer>';

  document.getElementById("sheet").innerHTML = html;
  document.title = "Árlista – Horváth Lámpapolír";
}
build().catch(e=>{ document.getElementById("sheet").innerHTML = '<div class="loading">Az árlista most nem tölthető be. Frissíts rá, vagy nézd meg a <a href="csomagok.html">Csomagok</a> oldalt.</div>'; });
</script>
</body>
</html>
