<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Az oldal nem található – Horváth Lámpapolír</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css?v=20260816v" />
  <script>try{var t=localStorage.getItem('hlp_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    .nf-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .nf-box { max-width: 520px; }
    .nf-logo { height: 92px; width: auto; border-radius: 16px; border: 1px solid rgba(240,180,41,0.4); margin-bottom: 22px; }
    .nf-code { font-family: var(--font-heading); font-size: clamp(3rem, 12vw, 5rem); font-weight: 800; color: var(--gold); line-height: 1; letter-spacing: 2px; }
    .nf-title { font-family: var(--font-heading); color: var(--chrome); font-size: 1.5rem; margin: 8px 0 6px; }
    .nf-text { color: var(--chrome-dim); font-size: 1.02rem; line-height: 1.6; margin-bottom: 26px; }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-box">
      <img class="nf-logo" src="/images/logo.png" alt="Horváth Lámpapolír" onerror="this.style.display='none'" />
      <div class="nf-code">404</div>
      <h1 class="nf-title">Ez az oldal nem található</h1>
      <p class="nf-text">Lehet, hogy elgépelted a címet, vagy egy régi linkre kattintottál. Nézz körül a főoldalon, vagy kérj időpontot!</p>
      <div class="nf-actions">
        <a class="btn btn--primary" href="/">Vissza a főoldalra</a>
        <a class="btn btn--ghost" href="/kapcsolat.html">Kapcsolat</a>
      </div>
    </div>
  </div>
</body>
</html>
